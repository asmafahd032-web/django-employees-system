<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        .title { font-size: 1.8rem; font-weight: 700; text-align: center; margin-bottom: 0.5rem; color: #38bdf8; }
        .subtitle { font-size: 0.9rem; color: #94a3b8; text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: #cbd5e1; }
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        .btn {
            width: 100%;
            padding: 0.85rem;
            border-radius: 10px;
            border: none;
            background: #0284c7;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.3s;
        }
        .btn:hover { background: #0369a1; }
        .error-msg { background: rgba(244, 63, 94, 0.2); border: 1px solid #f43f5e; color: #fecdd3; padding: 0.8rem; border-radius: 10px; margin-bottom: 1rem; font-size: 0.85rem; text-align: center; }
        .link-text { text-align: center; margin-top: 1.2rem; font-size: 0.85rem; color: #94a3b8; }
        .link-text a { color: #38bdf8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2 class="title">📝 حساب جديد</h2>
        <p class="subtitle">أدخلي بياناتكِ للتسجيل في النظام</p>

        {% if messages %}
            {% for message in messages %}
                <div class="error-msg">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" name="username" placeholder="مثال: asmaa" required>
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" name="email" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>تأكيد كلمة المرور</label>
                <input type="password" name="password_confirm" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">إنشاء الحساب</button>
        </form>

        <p class="link-text">لديكِ حساب بالفعل؟ <a href="{% url 'account:login' %}">تسجيل الدخول</a></p>
    </div>
</body>
</html>
