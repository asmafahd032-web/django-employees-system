<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة ملف موظف</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 30px;
        }
        .form-box {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 8px #ccc;
        }
        h1 {
            color: #24527a;
            text-align: center;
        }
        p {
            margin: 15px 0;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        input[type="checkbox"] {
            width: auto;
        }
        button {
            background: #24527a;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }
        .errorlist {
            color: red;
        }
    </style>
</head>
<body>
    <div class="form-box">
        <h1>إضافة ملف موظف</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">حفظ البيانات</button>
        </form>
    </div>
</body>
</html>
