<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال رسالة للأستاذة</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1d3557, #457b9d);
            color: #1d3557;
        }

        .email-card {
            width: 90%;
            max-width: 650px;
            background-color: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
            color: #1d3557;
        }

        .description {
            margin-bottom: 25px;
            text-align: center;
            color: #666;
        }

        .recipient {
            padding: 12px;
            margin-bottom: 20px;
            border-right: 5px solid #457b9d;
            background-color: #f1faee;
            color: #1d3557;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd6dd;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #457b9d;
            box-shadow: 0 0 5px rgba(69, 123, 157, 0.4);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background-color: #1d3557;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #457b9d;
        }

        .errorlist {
            padding: 0;
            color: #c1121f;
            list-style: none;
        }
    </style>
</head>
<body>
    <div class="email-card">
        <h1>إرسال رسالة للأستاذة</h1>
        <p class="description">إرسال رسالة من مشروع إدارة الموظفين</p>

        <div class="recipient">
            <strong>المستقبل:</strong>
            engreemalwaeel@gmail.com
        </div>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">إرسال الرسالة</button>
        </form>
    </div>
</body>
</html>
