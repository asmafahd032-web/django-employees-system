<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>قائمة المنتجات</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background-color: #0f172a;
            color: white;
            padding: 2rem;
        }
        .card {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            max-width: 500px;
        }
        .price { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>
    <h1>📦 المنتجات المسجلة في قاعدة البيانات</h1>

    {% if products %}
        {% for p in products %}
            <div class="card">
                <h3>🔹 {{ p.name }}</h3>
                <p><strong>القسم:</strong> {{ p.category }}</p>
                <p><strong>السعر:</strong> <span class="price">${{ p.price }}</span></p>
                <p><strong>الكمية المتاحة:</strong> {{ p.stock_quantity }}</p>
            </div>
        {% endfor %}
    {% else %}
        <p>لا توجد منتجات مسجلة حتى الآن.</p>
    {% endif %}
</body>
</html>
