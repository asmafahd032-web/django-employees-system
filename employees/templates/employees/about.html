<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>من نحن - نظام إدارة الموظفين</title>
    <style>
        :root {
            --bg-body: #ffffff;
            --bg-card: #f9fbfd;
            --primary-blue: #007bff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
        }

        .about-card {
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.06);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid #eef2f5;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            color: var(--primary-blue);
            margin-top: 0;
            font-size: 2em;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1em;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .btn-back {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s;
        }

        .btn-back:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="about-card">
        <div class="icon">ℹ️</div>
        <h1>حول النظام 🏢</h1>
        <p>
            هذا النظام مخصص لإدارة الموظفين ومتابعة بياناتهم السجلية والشخصية بكفاءة عالية داخل المنشأة.
        </p>
        <a href="{% url 'home' %}" class="btn-back">العودة للرئيسية</a>
    </div>

</body>
</html>
