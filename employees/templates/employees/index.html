<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الموظفين</title>
    <style>
        :root {
            --bg-body: #ffffff;
            --bg-card: #f9fbfd;
            --primary-blue: #007bff;
            --action-red: #e74c3c;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
        }

        .employee-card {
            background-color: var(--bg-card);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.06);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid #eef2f5;
            transition: transform 0.3s ease;
        }

        .employee-card:hover {
            transform: translateY(-5px);
        }

        .animated-icon {
            font-size: 60px;
            color: var(--primary-blue);
            margin-bottom: 25px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        h1 {
            color: var(--primary-blue);
            margin-top: 0;
            font-size: 2.3em;
            font-weight: 700;
            letter-spacing: -1px;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1em;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .btn-view-employees {
            background-color: var(--action-red);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1em;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.2);
        }

        .btn-view-employees:hover {
            background-color: #d3382c;
            transform: scale(1.05);
            box-shadow: 0 6px 10px rgba(231, 76, 60, 0.3);
        }

        .btn-view-employees:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="employee-card">
        <div class="animated-icon">👥</div>
        <h1>نظام إدارة الموظفين</h1>
        <p>
            مرحباً بك في لوحة تحكم الموظفين.<br>
            هذه الصفحة تم تحميلها بنجاح من قالب HTML الخاص بالتطبيق في Django.
        </p>
        <a href="{% url 'about' %}" class="btn-view-employees">من نحن / حول النظام ←</a>
    </div>

</body>
</html>
